name: Documentation issue
description: Report missing, stale, or incorrect docs
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: location
    attributes:
      label: Affected documentation
      description: File path(s) and section(s)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested correction
