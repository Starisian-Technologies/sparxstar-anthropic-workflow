name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Job 1: fetch specs, contracts, and ADRs declared in sparxstar-specs.yml.
  # Produces artifact "sparxstar-specs" containing:
  #   .sparxstar/specs/agent/   — repo spec at agent_ref (always main)
  #   .sparxstar/contracts/     — cross-repo contracts this repo is party to
  #   .sparxstar/adrs/          — ADRs that govern this repo
  # Scope is read from sparxstar-specs.yml at repo root — not hardcoded here.
  fetch-specs:
    permissions:
      contents: read
    uses: Starisian-Technologies/sparxstar-product-specification-registry/.github/workflows/fetch-specs.yml@v1
    # No secrets block needed — read token minted from the org-level composer-resolver GitHub App.

  # Job 2: three-pass Claude review consuming the fetched artifact.
  review:
    needs: fetch-specs
    permissions:
      contents: read
      pull-requests: write
    uses: Starisian-Technologies/sparxstar-claude-pr-review/.github/workflows/claude-pr-review.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    # specs-artifact input defaults to "sparxstar-specs" — matches fetch-specs.yml output.
