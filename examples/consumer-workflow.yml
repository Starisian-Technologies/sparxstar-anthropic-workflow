name: Claude PR Review

# Prerequisites in the consumer repo / org:
#   - Secret  ANTHROPIC_API_KEY             — Anthropic Messages API key.
#   - Secret  COMPOSER_RESOLVER_PRIVATE_KEY — composer-resolver GitHub App private key.
#   - Variable COMPOSER_RESOLVER_CLIENT_ID  — composer-resolver GitHub App client id
#                                             (org-level variable; read by the
#                                             reusable workflow via the vars context).

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
    # Pin to @v1 (moving major) or @v1.0.0 (locked). Do not reference @main.
    uses: Starisian-Technologies/sparxstar-claude-pr-review/.github/workflows/claude-pr-review.yml@v1
    with:
      # Tag of the ADR / product-spec registries to review against. Pin to a
      # real tag (v1 follows the major; v1.0.0 locks). The registry side
      # validates existence and floor — do not hardcode a computed version.
      contract_ref: v1
    secrets:
      # Pass each secret by name (not `secrets: inherit`).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COMPOSER_RESOLVER_PRIVATE_KEY: ${{ secrets.COMPOSER_RESOLVER_PRIVATE_KEY }}
